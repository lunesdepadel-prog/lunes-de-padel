name: Revisar respuestas de Telegram

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo un poco)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lunes-de-padel
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
      PUBLISH_INSTAGRAM: ${{ vars.PUBLISH_INSTAGRAM || 'true' }}
      PUBLISH_TIKTOK: ${{ vars.PUBLISH_TIKTOK || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Caché del modelo de recorte (rembg)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-general-use
      - run: pip install -r requirements.txt
      - run: python -m diario.check_approval
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "lunes-de-padel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || (git commit -m "Actualizar estado" && git push)
